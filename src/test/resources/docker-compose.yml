version: '3.8'

services:

  quad-store-server:
    image: atomgraph/fuseki:6.1
    hostname: quad-server
    container_name: quad-server
    command: --mem --update /ds
    ports:
      - 3030:3030
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3030/ds/sparql?query=ASK%7B%7D"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-server:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio-server
    container_name: minio-server
    env_file:
      - ./test.env
    environment:
      - MINIO_ROOT_USER=admintest
      - MINIO_ROOT_PASSWORD=admintest
    command: server /tmp/data
    ports:
      - 9000:9000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  store-service:
    image: openmbee/flexo-mms-store-service:v0.2.0
    hostname: store-service
    container_name: store-service
    env_file:
      - ./test.env
    environment:
      - S3_ENDPOINT=http://minio-server:9000
      - S3_REGION=us-west-1
      - AWS_ACCESS_KEY_ID=admintest
      - AWS_SECRET_ACCESS_KEY=admintest
    depends_on:
      minio-server:
        condition: service_healthy
    ports:
      - 8081:8080
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  default:
    name: flexo-mms-test-network
    driver: bridge
